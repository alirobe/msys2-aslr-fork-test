name: Mandatory, Bottom-up and High-entropy ASLR per process (IFEO)
on: workflow_dispatch
jobs:
  ifeo:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Mandatory ASLR and Bottom-up ASLR per process, stock / deps / all / allexe
        shell: pwsh
        run: ./ifeo.ps1
