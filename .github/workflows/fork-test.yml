name: msys2-runtime fork under ASLR in Windows containers
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            base: mcr.microsoft.com/windows/servercore:ltsc2022
          - runner: windows-2025
            base: mcr.microsoft.com/windows/servercore:ltsc2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run fork tests in containers
        shell: pwsh
        run: ./run-tests.ps1 -Base "${{ matrix.base }}"
  deps-first:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: stock vs deps-only vs all flagged, Mandatory ASLR off then on
        shell: pwsh
        run: ./deps-first.ps1
  pacman-docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            base: mcr.microsoft.com/windows/servercore:ltsc2022
            isolations: process,hyperv
          - runner: windows-2022
            base: mcr.microsoft.com/windows/servercore:ltsc2019
            isolations: hyperv
          - runner: windows-2025
            base: mcr.microsoft.com/windows/servercore:ltsc2025
            isolations: process,hyperv
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: full MSYS2 in a container, pacman and a fork scale test, stock / dyn / all
        shell: pwsh
        run: ./pacman-docker.ps1 -Base "${{ matrix.base }}" -Isolations ("${{ matrix.isolations }}" -split ',')
