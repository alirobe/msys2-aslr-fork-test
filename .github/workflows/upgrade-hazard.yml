name: Upgrade hazard, a running perl's forks after one of its DLLs is replaced, with and without /var/run/cygfork
on:
  workflow_dispatch:
jobs:
  hazard:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: perl
      - name: flag every usr/bin DLL and exe dynamicbase, then the hazard twice
        shell: pwsh
        run: ./upgrade-hazard-gh.ps1 -Msys2 "${{ steps.msys2.outputs.msys2-location }}"
        id: run
      - name: flag every usr/bin DLL and exe dynamicbase, then the hazard twice (location fallback)
        if: failure()
        shell: pwsh
        run: ./upgrade-hazard-gh.ps1 -Msys2 "D:\a\_temp\msys64"
