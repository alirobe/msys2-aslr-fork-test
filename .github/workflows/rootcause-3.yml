name: Root cause 3, image map source over container start, by layer placement
on:
  workflow_dispatch:
    inputs:
      base:
        description: Container image
        default: mcr.microsoft.com/windows/servercore:ltsc2019
      round:
        description: 3 (sampler, late, read first, single layer), 4 (access kinds, sharing, strace), 5 (file trace, SysMain stopped) or 6 (loader test with a plain exe)
        default: '3'
jobs:
  rootcause3:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: sampler, timeline, late start, read first, single layer
        shell: pwsh
        timeout-minutes: 120
        run: ./rootcause3.ps1 -Base "${{ inputs.base }}" -Round ${{ inputs.round }}
